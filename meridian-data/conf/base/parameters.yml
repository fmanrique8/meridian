s3:
  bucket_name: ${oc.env:S3_BUCKET_NAME}

fred:
  api_key: ${oc.env:FRED_API_KEY}
  base_url: https://api.stlouisfed.org/fred
  timeout_seconds: 20.0
  max_retries: 3
  backoff_seconds: 0.5
  jitter_seconds: 0.2
  observation_start: 1990-01-01
  observation_end:
  sort_order: asc
  sync_mode: full
  limit:
  run_date:
  data_quality:
    max_null_ratio_per_series: 0.2
    enforce_monotonic_dates: true
    enforce_unique_series_date: true
    enforce_numeric_parse: true
    enforce_valid_dates: true
  series_ids:
    # ----- inflation
    - CPIAUCSL
    - CPILFESL
    - PCEPI
    - PCEPILFE

    # ----- labor
    - UNRATE
    - PAYEMS
    - CIVPART
    - ICSA

    # ----- growth
    - GDPC1

    # ----- rates / liquidity
    - FEDFUNDS
    - DFF
    - DGS10
    - DGS2
    - T10Y2Y

    # ----- energy
    - DCOILWTICO
    - GASREGW
    - DHHNGSP

convergence:
  run_date:
  time_grain: weekly
  week_anchor: friday
  source_set_version: fred_v1
  thresholds:
    # Initial calibrated defaults (v1) to reduce noise-driven state flips.
    # These remain tunable and should be refined with historical backtesting.
    inflation_sticky_band: 0.3
    labor_unrate_tight_threshold: -0.1
    labor_claims_tight_threshold: 0.0
    labor_unrate_deteriorating_threshold: 0.2
    labor_claims_deteriorating_threshold: 15000.0
    growth_expansion_relative_threshold: 0.05
    growth_contraction_threshold: 0.0
    liquidity_curve_tightening_threshold: 0.0
    liquidity_rates_tightening_threshold: 0.0
    liquidity_curve_easing_threshold: 0.25
    liquidity_rates_easing_threshold: -0.25
