macro__fred__raw__series:
  type: partitions.PartitionedDataset
  path: data/01_raw/macro/fred/series
  filename_suffix: ".parquet"
  dataset:
    type: polars.EagerPolarsDataset
    file_format: parquet
    save_args:
      compression: zstd

